<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- 毛茸茸的身体渐变 -->
    <radialGradient id="bodyGrad" cx="50%" cy="35%" r="65%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="70%" style="stop-color:#f5f0eb"/>
      <stop offset="100%" style="stop-color:#e8e0d8"/>
    </radialGradient>
    <!-- 腮红渐变 -->
    <radialGradient id="blushGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffb7c5"/>
      <stop offset="100%" style="stop-color:#ff9eb5;stop-opacity:0"/>
    </radialGradient>
    <!-- 舌头渐变 -->
    <linearGradient id="tongueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff8da1"/>
      <stop offset="100%" style="stop-color:#ff6b88"/>
    </linearGradient>
    <!-- 提莫帽子渐变 -->
    <linearGradient id="hatGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B4513"/>
      <stop offset="50%" style="stop-color:#654321"/>
      <stop offset="100%" style="stop-color:#4a2c0a"/>
    </linearGradient>
    <!-- 眼睛高光 -->
    <radialGradient id="eyeShine" cx="30%" cy="30%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </radialGradient>
  </defs>
  
  <!-- 提莫帽子 -->
  <g>
    <!-- 帽子主体 -->
    <ellipse cx="60" cy="28" rx="28" ry="16" fill="url(#hatGrad)">
      <animate attributeName="cy" values="28;26;28" dur="2s" repeatCount="indefinite"/>
    </ellipse>
    <!-- 帽子条纹 -->
    <ellipse cx="60" cy="28" rx="22" ry="10" fill="none" stroke="#3d2314" stroke-width="2" opacity="0.3">
      <animate attributeName="cy" values="28;26;28" dur="2s" repeatCount="indefinite"/>
    </ellipse>
    <!-- 帽顶装饰球 -->
    <circle cx="60" cy="14" r="6" fill="#2d5016">
      <animate attributeName="cy" values="14;12;14" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="60" cy="14" r="4" fill="#3d6b1e">
      <animate attributeName="cy" values="14;12;14" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- 毛茸茸的身体（圆滚滚的） -->
  <ellipse cx="60" cy="70" rx="42" ry="38" fill="url(#bodyGrad)">
    <animate attributeName="ry" values="38;40;38" dur="2s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- 身体上的毛毛边缘 -->
  <g fill="#f0e8e0" opacity="0.8">
    <circle cx="25" cy="65" r="6"/>
    <circle cx="20" cy="75" r="5"/>
    <circle cx="95" cy="65" r="6"/>
    <circle cx="100" cy="75" r="5"/>
    <circle cx="30" cy="95" r="5"/>
    <circle cx="90" cy="95" r="5"/>
  </g>
  
  <!-- 左耳朵 -->
  <ellipse cx="30" cy="40" rx="10" ry="15" fill="url(#bodyGrad)" transform="rotate(-25 30 40)">
    <animateTransform attributeName="transform" type="rotate" values="-25 30 40;-20 30 40;-25 30 40" dur="1.5s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- 右耳朵 -->
  <ellipse cx="90" cy="40" rx="10" ry="15" fill="url(#bodyGrad)" transform="rotate(25 90 40)">
    <animateTransform attributeName="transform" type="rotate" values="25 90 40;20 90 40;25 90 40" dur="1.5s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- 犄角（魄罗标志性的小角） -->
  <path d="M60 38 Q58 22 52 28 Q56 32 60 38" fill="#8B7355" stroke="#6b5344" stroke-width="1">
    <animate attributeName="d" values="M60 38 Q58 22 52 28 Q56 32 60 38;M60 36 Q58 20 52 26 Q56 30 60 36;M60 38 Q58 22 52 28 Q56 32 60 38" dur="2s" repeatCount="indefinite"/>
  </path>
  
  <!-- 左眼睛（大大的可爱眼睛） -->
  <g>
    <!-- 眼白 -->
    <ellipse cx="45" cy="62" rx="12" ry="14" fill="#ffffff" stroke="#e0d8d0" stroke-width="1"/>
    <!-- 瞳孔 -->
    <ellipse cx="47" cy="64" rx="8" ry="10" fill="#1a1a2e">
      <animate attributeName="ry" values="10;2;10" dur="4s" repeatCount="indefinite"/>
    </ellipse>
    <!-- 高光 -->
    <circle cx="43" cy="59" r="4" fill="url(#eyeShine)"/>
    <circle cx="50" cy="67" r="2" fill="#ffffff" opacity="0.6"/>
  </g>
  
  <!-- 右眼睛 -->
  <g>
    <!-- 眼白 -->
    <ellipse cx="75" cy="62" rx="12" ry="14" fill="#ffffff" stroke="#e0d8d0" stroke-width="1"/>
    <!-- 瞳孔 -->
    <ellipse cx="73" cy="64" rx="8" ry="10" fill="#1a1a2e">
      <animate attributeName="ry" values="10;2;10" dur="4s" repeatCount="indefinite"/>
    </ellipse>
    <!-- 高光 -->
    <circle cx="70" cy="59" r="4" fill="url(#eyeShine)"/>
    <circle cx="77" cy="67" r="2" fill="#ffffff" opacity="0.6"/>
  </g>
  
  <!-- 鼻子（小小的黑鼻子） -->
  <ellipse cx="60" cy="75" rx="5" ry="4" fill="#2d2d2d"/>
  <ellipse cx="59" cy="74" rx="2" ry="1.5" fill="#4a4a4a" opacity="0.5"/>
  
  <!-- 吐舌头（萌萌的粉色舌头） -->
  <g>
    <ellipse cx="60" cy="92" rx="12" ry="15" fill="url(#tongueGrad)">
      <animate attributeName="ry" values="15;18;15" dur="1s" repeatCount="indefinite"/>
    </ellipse>
    <!-- 舌头中线 -->
    <line x1="60" y1="82" x2="60" y2="100" stroke="#ff5277" stroke-width="2" opacity="0.4">
      <animate attributeName="y2" values="100;105;100" dur="1s" repeatCount="indefinite"/>
    </line>
  </g>
  
  <!-- 左腮红 -->
  <ellipse cx="28" cy="72" rx="10" ry="7" fill="url(#blushGrad)"/>
  
  <!-- 右腮红 -->
  <ellipse cx="92" cy="72" rx="10" ry="7" fill="url(#blushGrad)"/>
  
  <!-- 胡须点（魄罗的标志） -->
  <g fill="#c9bfb3">
    <circle cx="32" cy="68" r="2"/>
    <circle cx="28" cy="76" r="2"/>
    <circle cx="35" cy="80" r="1.5"/>
    <circle cx="88" cy="68" r="2"/>
    <circle cx="92" cy="76" r="2"/>
    <circle cx="85" cy="80" r="1.5"/>
  </g>
  
  <!-- 小脚丫 -->
  <ellipse cx="42" cy="105" rx="10" ry="6" fill="url(#bodyGrad)" stroke="#e0d8d0" stroke-width="1">
    <animate attributeName="cy" values="105;103;105" dur="1.5s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="78" cy="105" rx="10" ry="6" fill="url(#bodyGrad)" stroke="#e0d8d0" stroke-width="1">
    <animate attributeName="cy" values="105;103;105" dur="1.5s" repeatCount="indefinite" begin="0.3s"/>
  </ellipse>
</svg>
